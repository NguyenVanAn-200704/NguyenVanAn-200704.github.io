<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyễn Văn An - Portfolio</title>
  <script>
    // Mọi đường dẫn không tồn tại đều về portfolio.
    // /portfolio, /PORTFOLIO/... (sai hoa thường) -> /Portfolio/... giữ nguyên phần sau, query và hash.
    (function () {
      var path = location.pathname;
      var target = /^\/portfolio(\/|$)/i.test(path)
        ? "/Portfolio" + path.slice("/portfolio".length)
        : "/Portfolio/";
      if (target === "/Portfolio") target = "/Portfolio/";
      location.replace(target + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f11; color: #e9e7e2; font: 16px system-ui, sans-serif; }
    a { color: #d98a4f; }
  </style>
</head>
<body>
  <p>Đang chuyển tới portfolio… <a href="/Portfolio/">Mở portfolio</a></p>
</body>
</html>
